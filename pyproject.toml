[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "color-composer-client"
version = "0.1.0"
description = "A client for Color Composer server to control NeoPixel LED strips"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "GNU General Public License v3 (GPLv3)"}
authors = [
    {name = "Cyborg-Squirrel"},
]
keywords = ["neopixel", "led", "raspberry-pi", "color-composer"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
]

dependencies = [
    "flask>=2.0.0",
    "websockets>=10.0",
    "adafruit-circuitpython-neopixel>=6.0.0",
    "adafruit-blinka>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "pylint>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/Cyborg-Squirrel/color-composer-client"
Repository = "https://github.com/Cyborg-Squirrel/color-composer-client"

[project.scripts]
color-composer-client = "color_composer_client.flask_server:main"

[tool.setuptools]
packages = ["color_composer_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=color_composer_client --cov-report=html --cov-report=term-missing"
